name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.8"
          enable-cache: true
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gir1.2-webkit2-4.1 libcairo2-dev libgirepository1.0-dev \
            libgtk-3-0t64 libwebkit2gtk-4.1-0 pkg-config python3-dev python3-gi
      - name: Install locked dependencies
        run: |
          corepack enable pnpm
          uv sync --frozen --group dev
          pnpm --dir frontend install --frozen-lockfile
      - name: Verify locks and versions
        run: |
          uv lock --check
          uv lock --project components/dinov3-provider --check
          .venv/bin/python scripts/check-version.py
      - name: Lint and test
        run: |
          .venv/bin/ruff check backend desktop tests scripts components/dinov3-provider/src components/dinov3-provider/tests
          PYTHONPATH=components/dinov3-provider/src .venv/bin/pytest
          pnpm --dir frontend typecheck
          pnpm --dir frontend build
