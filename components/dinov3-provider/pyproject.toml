[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-toolbox-dinov3-provider"
version = "0.1.0"
description = "DINOv3 embedding sidecar for Automation Toolbox"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy>=2.0,<3.0",
  "Pillow>=11.0,<13.0",
  "safetensors>=0.5,<1.0",
  "torch>=2.7,<3.0",
  "transformers>=4.56,<5.0",
]

[project.scripts]
automation-toolbox-provider-dinov3 = "automation_toolbox_dinov3_provider.__main__:main"

[dependency-groups]
build = ["pyinstaller>=6.14,<7.0"]
dev = ["pytest>=8.3,<9.0", "ruff>=0.9,<1.0"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

