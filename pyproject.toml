[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-toolbox"
dynamic = ["version"]
description = "Local-first visual automation toolbox"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.0",
  "starlette==1.3.1",
  "uvicorn[standard]>=0.34,<0.52",
  "pydantic>=2.10,<2.14",
  "pydantic-settings>=2.7,<2.15",
  "pywebview>=6.0,<7.0",
  "numpy>=2.0,<3.0",
  "opencv-python-headless>=4.10,<5.0",
  "Pillow>=11.0,<13.0",
  "PyYAML>=6.0,<7.0",
  "tqdm>=4.67,<5.0",
  "pycairo>=1.27,<2.0; sys_platform == 'linux'",
  "PyGObject>=3.48,<3.49; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
  # AnyIO 4.14.2 can deadlock Starlette's BlockingPortal-based TestClient.
  "anyio>=4.13,<4.14",
  "httpx2>=2.10,<3.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]
build = [
  "pyinstaller>=6.14,<7.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "desktop*"]

[tool.setuptools.dynamic]
version = {attr = "backend.version.__version__"}

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
